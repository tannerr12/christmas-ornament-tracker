<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Christmas Ornament Tracker</title>
<style>body{background:#f6f5f0;color:#234538;font:16px system-ui,sans-serif;margin:8vh auto;max-width:650px;padding:24px}h1{font-size:1.6rem}.loader{width:100%;height:9px;border-radius:9px;background:#e1e7e1;overflow:hidden}.bar{height:100%;background:#2a6852;width:0;transition:width .2s}#error{color:#a32020;white-space:pre-wrap}</style></head>
<body><h1>🎄 Christmas Ornament Tracker</h1><p id="status">Loading the photo inventory…</p><div class="loader"><div id="bar" class="bar"></div></div><p id="error"></p>
<script>
(async()=>{
  const count=44, pieces=Array(count);
  let loaded=0;
  await Promise.all(Array.from({length:count},async(_,i)=>{
    const path='chunks/part-'+String(i).padStart(3,'0')+'.txt';
    const response=await fetch(path,{cache:'default'});
    if(!response.ok)throw Error('Could not load '+path+' ('+response.status+')');
    pieces[i]=await response.text();
    document.getElementById('bar').style.width=(++loaded/count*100).toFixed(0)+'%';
    document.getElementById('status').textContent='Loading photographs: '+loaded+' / '+count;
  }));
  let html=pieces.join('');
  if(!html.startsWith('<!DOCTYPE html>')||!html.includes('</html>'))throw Error('Incomplete inventory content');

  // Homeowner confirmed the village sideboard is in the dining room.
  const storeAnchor="const STORE='christmas_v4_20261122';";
  if(!html.includes(storeAnchor))throw Error('Inventory script entrypoint not found');
  html=html.replace(storeAnchor,`const diningSideboard=DATA.zones.find(z=>z.id==='sideboard');
if(diningSideboard)diningSideboard.area='Dining room';
for(const item of DATA.items)if(item.zone==='sideboard')item.room='Dining room';
`+storeAnchor);
  const itemAnchor="const zones=DATA.zones;";
  if(!html.includes(itemAnchor))throw Error('Inventory item state not found');
  html=html.replace(itemAnchor,"for(const item of items)if(item.zone==='sideboard')item.room='Dining room';"+String.fromCharCode(10)+itemAnchor);
  const diningGroup="['Dining / adjoining display area',zones.filter(z=>z.area==='Dining / adjoining display area')],";
  if(!html.includes(diningGroup))throw Error('Dining section not found');
  html=html.replace(diningGroup,"['Dining room',zones.filter(z=>z.area==='Dining room')],"+String.fromCharCode(10)+" "+diningGroup);
  html=html.replace('Dining / display area = village sideboard and china hutch.','Dining room = village sideboard beneath the picture frames; china hutch = adjoining display area.');
  html=html.replace('The first walkthrough also shows the china hutch and long village sideboard in their adjoining display area.','The first walkthrough also shows the china hutch in its adjoining display area and the village sideboard beneath the picture frames in the dining room.');

  // Enrich the original 167-item archive without rewriting its 44 large chunks.
  try {
    const patchResponse=await fetch('kitchen/manifest.json');
    if(!patchResponse.ok)throw Error('Kitchen manifest HTTP '+patchResponse.status);
    const kitchen=await patchResponse.json();
    if(!Array.isArray(kitchen.items)||!Array.isArray(kitchen.zones)||!kitchen.media)throw Error('Invalid kitchen inventory data');

    const injection=`
const KITCHEN_PATCH=${JSON.stringify(kitchen)};
if(!DATA.zones.some(z=>z.id==='kitchen-frosted-door')){
 DATA.zones.push(...KITCHEN_PATCH.zones);
 DATA.items.push(...KITCHEN_PATCH.items);
 DATA.photo_count=(DATA.photo_count||40)+4;
 DATA.version='4.1';
 const tvk=DATA.items.find(i=>i.id==='TVK-03');
 if(tvk)Object.assign(tvk,{zone:'kitchen-ceiling',room:'Kitchen',photo:'1000017485.jpg',name:'Hanging honeycomb Santa carrying presents',category:'Hanging paper decoration',position:'Suspended from kitchen ceiling above range/cabinet area',x:49,y:54,confidence:'high',notes:'Same hanging figure seen earlier from TV-room kitchen doorway; re-linked instead of double counting.'});
 const oldZone=DATA.zones.find(z=>z.id==='tv-kitchen-door');
 if(oldZone)oldZone.count=2;
 Object.assign(MEDIA,KITCHEN_PATCH.media);
}
function buildKitchenThumbs(){
 for(const pic of Object.keys(KITCHEN_PATCH.media)){
  const im=new Image();
  im.onload=()=>{
   const its=DATA.items.filter(i=>i.photo===pic);
   for(const item of its){
    const w=im.naturalWidth,h=im.naturalHeight;
    const sw=Math.min(w,w*0.33),sh=Math.min(h,h*0.29);
    const sx=Math.max(0,Math.min(w-sw,w*item.x/100-sw/2));
    const sy=Math.max(0,Math.min(h-sh,h*item.y/100-sh/2));
    const cv=document.createElement('canvas');
    cv.width=160;cv.height=160;
    const cx=cv.getContext('2d');
    if(!cx)continue;
    cx.drawImage(im,sx,sy,sw,sh,0,0,160,160);
    try{THUMBS[item.id]=cv.toDataURL('image/webp',0.75)}catch(e){}
   }
   if(page==='inventory')renderInventory();
   else if(page==='photos')renderPhotos();
  };
  im.src=MEDIA[pic];
 }
}
`;
    const anchor="const STORE='christmas_v4_20261122';";
    if(!html.includes(anchor))throw Error('Original inventory JavaScript entrypoint changed');
    html=html.replace(anchor,injection+anchor);
    const roomAnchor="['Living room',zones.filter(z=>z.area==='Living room')],";
    if(!html.includes(roomAnchor))throw Error('House map room template changed');
    html=html.replace(roomAnchor,roomAnchor+"\n ['Kitchen',zones.filter(z=>z.area==='Kitchen')],");
    html=html.replace('167 labeled decorations & display components','203 labeled decorations & display components')
      .replace('23 display locations','27 display locations')
      .replace('40 photographs + 2 walkthroughs','44 photographs + 2 walkthroughs')
      .replace('167 item photo close-ups','167 detailed close-ups + 4 kitchen photographs')
      .replace('showPage(\'house\');\n<\/script>',"showPage('house');buildKitchenThumbs();\n<\/script>");
    html=html.replace('The first walkthrough also shows the china hutch','Four kitchen photo references now cover the interior glass door, sink/window, honeycomb Santa and patio slider. The first walkthrough also shows the china hutch');
  } catch(err) {
    console.warn('Kitchen addendum unavailable; original inventory still loads.',err);
  }

  document.open();document.write(html);document.close();
})().catch(e=>{
document.getElementById('error').textContent='The tracker could not load. Refresh the page or check the GitHub Pages deployment. '+e.message;
document.getElementById('status').textContent='Loading failed';
})();
</script></body></html>
